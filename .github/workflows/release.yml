name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: dotdim.exe
            asset_name: dotdim-windows-x86_64.zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: dotdim
            asset_name: dotdim-linux-x86_64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" -DestinationPath "${{ matrix.asset_name }}"

      - name: Package Unix artifact
        if: runner.os != 'Windows'
        run: |
          tar -czf "${{ matrix.asset_name }}" -C "target/${{ matrix.target }}/release" "${{ matrix.artifact_name }}"

      - name: Wait for GitHub API
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            if curl -sSf --connect-timeout 10 https://api.github.com >/dev/null; then
              echo "GitHub API reachable"
              break
            fi
            echo "GitHub API not reachable, retrying ($i/5)..."
            sleep $((i * 5))
            if [ "$i" -eq 5 ]; then
              echo "GitHub API unreachable after retries" >&2
              exit 1
            fi
          done

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
