[package]
name = "dotdim"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A lightning-fast CLI utility that colorizes and intelligently masks your .env files"
repository = "https://github.com/AshishOverflow/dotdim"
homepage = "https://github.com/AshishOverflow/dotdim"
readme = "README.md"
keywords = ["env", "cli", "secrets", "masking", "security"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
colored = "2.2"
is-terminal = "0.4"
